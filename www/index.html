<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cửu Thiên Tu Tiên - Mộng Ảo Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
        <link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-[url('https://images.unsplash.com/photo-1603774844336-db12781bb45b?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center bg-fixed">
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-0"></div>

    <div class="mobile-container bg-slate-950/40 relative z-10 sm:my-2 sm:h-[calc(100dvh-16px)] sm:rounded-3xl sm:border sm:border-white/10 overflow-hidden">
        
        <!-- Header Info -->
        <div class="glass-panel p-2 sm:p-3 flex flex-wrap items-center gap-2 shrink-0 shadow-lg border-b border-white/10 relative z-40">
            <div class="flex items-center gap-2 shrink-0 w-full mb-1">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-cyan-400 flex items-center justify-center shadow-[0_0_10px_rgba(6,182,212,0.4)] relative">
                    <span class="text-xl">🧑‍🌾</span>
                    <div id="save-indicator" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-green-500 rounded-full border border-slate-900 opacity-0 transition-opacity"></div>
                </div>
                <div class="flex-1 flex justify-between items-center">
                    <div>
                        <h1 class="text-sm font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500" id="ui-name">Vô Danh Thiếu Niên</h1>
                        <div class="text-[10px] font-semibold text-cyan-400 uppercase tracking-wide" id="ui-realm">Phàm Nhân • Sơ Kỳ <span class="text-white">(Lv 1)</span></div>
                    </div>
                    <div class="flex gap-1 items-center">
                        <button onclick="exportSave()" title="Lưu ra file JSON" class="text-slate-400 hover:text-green-400 text-lg bg-slate-900/50 px-2 py-1 rounded border border-white/5 transition-colors">💾</button>
                        <label for="import-save" title="Tải file JSON" class="text-slate-400 hover:text-blue-400 text-lg bg-slate-900/50 px-2 py-1 rounded border border-white/5 transition-colors cursor-pointer m-0">📂</label>
                        <input type="file" id="import-save" class="hidden" accept=".json" onchange="importSave(event)" />
                        <button onclick="openAdminModal()" title="Bảng Admin" class="text-slate-400 hover:text-amber-400 text-lg bg-slate-900/50 px-2 py-1 rounded border border-white/5 transition-colors">⚙️</button>
                        <button onclick="hardReset()" title="Xóa dữ liệu" class="text-slate-500 hover:text-red-500 text-[10px] bg-slate-900/50 px-2 py-1 rounded border border-white/5 transition-colors">Reset</button>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 grid grid-cols-6 gap-1.5 w-full text-[9px] sm:text-[10px]">
                <div class="bg-black/60 p-1 rounded-md border border-white/5 relative overflow-hidden flex flex-col justify-center">
                    <div class="flex justify-between text-slate-300 mb-0.5 relative z-10"><span class="font-bold">HP</span> <span id="ui-hp" class="text-rose-400">100</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1 relative z-10"><div id="ui-hp-bar" class="bg-rose-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div></div>
                </div>
                <div class="bg-black/60 p-1 rounded-md border border-white/5 relative overflow-hidden flex flex-col justify-center">
                    <div class="flex justify-between text-slate-300 mb-0.5 relative z-10"><span class="font-bold">MP</span> <span id="ui-mp" class="text-blue-400">50</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1 relative z-10"><div id="ui-mp-bar" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div></div>
                </div>
                <div class="bg-black/60 p-1 rounded-md border border-white/5 flex flex-col items-center justify-center">
                    <div class="text-slate-400 font-bold mb-0.5 text-[8px]">Linh Thạch</div>
                    <div class="text-amber-400 font-bold drop-shadow-[0_0_2px_#fbbf24]" id="ui-coins">500</div>
                </div>
                <div class="bg-black/60 p-1 rounded-md border border-white/5 relative overflow-hidden flex flex-col justify-center">
                    <div class="flex justify-between text-slate-300 mb-0.5 relative z-10"><span class="font-bold">Chân Nguyên</span> <span id="ui-primal" class="text-emerald-300">0</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1 relative z-10"><div class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div></div>
                </div>
                <div class="bg-black/60 p-1 rounded-md border border-white/5 relative overflow-hidden flex flex-col justify-center">
                    <div class="flex justify-between text-slate-300 mb-0.5 relative z-10"><span class="font-bold">Tiến Độ Tu Vi</span> <span id="ui-tuvi" class="text-violet-300">0%</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1 relative z-10"><div id="ui-tuvi-bar" class="bg-violet-500 h-full rounded-full transition-all duration-300 shadow-[0_0_5px_#8b5cf6]" style="width: 0%"></div></div>
                </div>
                <div class="bg-black/60 p-1 rounded-md border border-white/5 relative overflow-hidden flex flex-col justify-center">
                    <div class="flex justify-between text-slate-300 mb-0.5 relative z-10"><span class="font-bold">EXP</span> <span id="ui-exp" class="text-cyan-300">0%</span></div>
                    <div class="w-full bg-slate-900 rounded-full h-1 relative z-10"><div id="ui-exp-bar" class="bg-cyan-500 h-full rounded-full transition-all duration-300 shadow-[0_0_5px_#06b6d4]" style="width: 0%"></div></div>
                </div>
            </div>
        </div>

        <div class="flex-1 relative overflow-hidden bg-black/40">
            <div class="absolute inset-0 smooth-scroll" id="main-scroll-area">
                <div id="views-container"></div>
            </div> 
        </div>

        <div class="h-24 sm:h-28 shrink-0 glass-panel border-t border-white/10 p-2 flex flex-col relative z-30">
            <h3 class="text-cyan-400 font-bold border-b border-white/5 pb-1 mb-1.5 flex justify-between items-center text-[10px]">
                <span class="flex items-center gap-1"><span>📜</span> Nhật Ký Thiên Đạo</span>
                <button onclick="document.getElementById('game-log').innerHTML=''" class="text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded transition-colors">Dọn Dẹp</button>
            </h3>
            <div id="game-log" class="flex-1 smooth-scroll font-mono text-[9px] sm:text-[10px] leading-relaxed space-y-1 flex flex-col-reverse pr-1"></div>
        </div>

        <div class="h-[65px] sm:h-[75px] bg-slate-950/95 backdrop-blur-xl border-t border-white/10 shrink-0 flex overflow-x-auto no-scrollbar snap-x relative z-40 pb-1">
            <button onclick="switchTab('combat', this)" class="nav-btn active flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_meditate.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Tu Luyện</span>
            </button>
            <button onclick="switchTab('char', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_character.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Nhân Vật</span>
            </button>
            <button onclick="switchTab('dongphu', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_home.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Động Phủ</span>
            </button>
            <button onclick="switchTab('companion', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_pet.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Linh Thú</span>
            </button>
            <button onclick="switchTab('inv', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_inventory.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Túi Đồ</span>
            </button>
            <button onclick="switchTab('shop', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_shop.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Cửa Hàng</span>
            </button>
            <button onclick="switchTab('map', this)" class="nav-btn flex-1 min-w-[55px] sm:min-w-[70px] snap-center flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition-all">
                <img src="assets/images/nav_map.jpg" class="w-7 h-7 sm:w-8 sm:h-8 object-cover rounded-full border-[1.5px] border-slate-600/50 shadow-md transition-all duration-300">
                <span class="text-[9px] font-bold text-center leading-none">Bản Đồ</span>
            </button>
        </div>

        <script src="js/views/combat.js"></script>
    <script src="js/views/char.js"></script>
    <script src="js/views/dongphu.js"></script>
    <script src="js/views/companion.js"></script>
    <script src="js/views/inv.js"></script>
    <script src="js/views/shop.js"></script>
    <script src="js/views/map.js"></script>
    <script src="js/views/modal_meditate.js"></script>
    <script src="js/views/modal_admin.js"></script>
    <script src="js/views/modal_dialog.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const viewsHtml = TPL_COMBAT + TPL_CHAR + TPL_DONGPHU + TPL_COMPANION + TPL_INV + TPL_SHOP + TPL_MAP;
            document.getElementById("views-container").innerHTML = viewsHtml;
            const modalsHtml = TPL_MODAL_MEDITATE + TPL_MODAL_ADMIN + TPL_MODAL_DIALOG;
            // Append modals to mobile-container or body
            const modalsContainer = document.createElement('div');
            modalsContainer.id = 'modals-container';
            modalsContainer.innerHTML = modalsHtml;
            document.querySelector('.mobile-container').appendChild(modalsContainer);
        });
    </script>
    <script src="js/audio.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/mechanics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
